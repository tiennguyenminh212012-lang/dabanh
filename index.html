<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018">
<title>5v5 Tactical Simulator</title>
<style>
:root{--bg:#070b10;--panel:#101820;--panel2:#18222d;--text:#edf3f8;--muted:#8d9aaa;--red:#ef4444;--blue:#3b82f6;--green:#45d483;--yellow:#ffd166;--orange:#fb923c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#182637 0,#070b10 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}
.app{min-height:100vh;padding:10px;display:flex;flex-direction:column;gap:9px}.topbar,.panel{background:#101820ee;border:1px solid #ffffff12;border-radius:14px;box-shadow:0 12px 35px #0006}.topbar{padding:10px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:18px;font-weight:900;margin-right:auto}.brand span{color:var(--red)}.selectWrap{display:flex;align-items:center;gap:6px}.selectWrap label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}.selectWrap select{background:#0b1118;border:1px solid #ffffff18;border-radius:8px;padding:9px 30px 9px 10px;max-width:300px;outline:none}
.main{display:flex;justify-content:center;min-height:0}.stage{width:min(1100px,100%);display:flex;flex-direction:column;gap:9px}.board{display:flex;justify-content:center;align-items:center;padding:3px;position:relative}.pitch{position:relative;width:min(1050px,100%);aspect-ratio:1.68/1;background:#277847;border:2px solid #e9f6eb;border-radius:7px;overflow:hidden;box-shadow:0 25px 70px #0009;touch-action:none}.pitch:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff00009 0 8.33%,transparent 8.33% 16.66%)}.mid{position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #ffffff7a}.circle{position:absolute;width:20%;aspect-ratio:1;left:40%;top:40%;border:1px solid #ffffff7a;border-radius:50%}.dot{position:absolute;width:6px;height:6px;left:calc(50% - 3px);top:calc(50% - 3px);background:#fff;border-radius:50%}.box{position:absolute;top:25%;height:50%;width:14%;border:1px solid #ffffff80}.box.l{left:0;border-left:0}.box.r{right:0;border-right:0}.goal{position:absolute;top:39%;height:22%;width:2.5%;border:2px solid #fff}.goal.l{left:-1%}.goal.r{right:-1%}.direction{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#ffffffb8;z-index:1}
.player{position:absolute;width:clamp(38px,5vw,52px);height:clamp(38px,5vw,52px);transform:translate(-50%,-50%);border-radius:50%;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(7px,1vw,10px);font-weight:900;line-height:1;user-select:none;transition:left .08s linear,top .08s linear}.player.red{background:var(--red);box-shadow:0 0 0 2px #fff9,0 5px 15px #0007}.player.blue{background:var(--blue);box-shadow:0 0 0 2px #fff9,0 5px 15px #0007}.player.hot{outline:3px solid var(--yellow);outline-offset:2px}.player .num{font-size:8px;opacity:.75}.player .name{margin-top:2px;text-shadow:0 1px 2px #000}
.ball{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #111;transform:translate(-50%,-50%);z-index:8;box-shadow:0 2px 8px #0009;transition:left .04s linear,top .04s linear}.ball.hot{box-shadow:0 0 0 5px #ffd16655,0 2px 8px #0009}.arrow{position:absolute;height:3px;transform-origin:left center;z-index:3;pointer-events:none;border-radius:3px;opacity:.95}.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:12px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}.pass{background:var(--yellow);color:var(--yellow)}.move{background:var(--green);color:var(--green)}.press{background:#fb7185;color:#fb7185}
.controls{padding:10px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn{border:1px solid #ffffff1d;background:var(--panel2);padding:10px 13px;border-radius:9px;font-weight:850}.btn.play{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}.speed{display:flex;align-items:center;gap:4px;margin-left:auto;color:var(--muted);font-size:11px}.speed button{background:#ffffff07;border:1px solid #ffffff10;padding:7px 9px;border-radius:7px}.speed button.active{background:#ffffff18;color:#fff}.timeline{width:100%;display:flex;align-items:center;gap:8px;color:var(--muted);font:10px ui-monospace,monospace}.track{height:5px;flex:1;background:#ffffff12;border-radius:6px;overflow:hidden}.fill{height:100%;width:0;background:var(--red)}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:9px}.info,.logPanel{padding:11px}.sectionTitle{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:900;margin-bottom:7px}.result{font-size:13px;font-weight:800;min-height:34px}.result.green{color:#70e6a7}.result.red{color:#ff7c7c}.result.yellow{color:#ffd166}.meta{font-size:10px;color:var(--muted);line-height:1.45}.logPanel{min-height:0}.log{height:145px;overflow:auto;background:#0a1016;border-radius:9px;padding:8px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.event{padding:4px 0;border-bottom:1px solid #ffffff08}.event b{color:#fff}.collapseBtn{float:right;background:#ffffff08;border:1px solid #ffffff10;border-radius:6px;padding:4px 7px;font-size:10px}.collapsed .log{display:none}
.decision{display:none;margin-top:9px;background:#211d12;border:1px solid #f5c15a55;border-radius:9px;padding:9px}.decision.show{display:block}.decision p{margin:0 0 7px;font-size:11px}.decision .opts{display:flex;gap:6px;flex-wrap:wrap}.decision button{background:#ffffff0b;border:1px solid #ffffff12;border-radius:7px;padding:7px 9px;font-size:10px}
@media(max-width:800px){.app{padding:7px}.topbar{padding:8px}.brand{width:100%;margin:0;font-size:16px}.selectWrap{flex:1}.selectWrap select{width:100%;max-width:none}.board{padding:0}.pitch{width:100%}.controls{position:sticky;bottom:7px;z-index:30;padding:8px}.btn{flex:1;min-width:0;padding:11px 6px;font-size:11px}.speed{width:100%;justify-content:center;margin-left:0}.speed button{flex:1}.bottom{grid-template-columns:1fr}.logPanel{order:2}.log{height:130px}.info{order:1}.player{width:42px;height:42px;font-size:8px}}
@media(min-width:801px){.topbar{max-width:1100px;width:100%;margin:0 auto}.main{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">5v5 <span>TACTICAL SIMULATOR</span></div>
  <div class="selectWrap"><label>Situation</label><select id="situation"></select></div>
  <div class="selectWrap"><label>Our tactic</label><select id="tactic"><option value="def">3-1 Defensive Plan</option><option value="counter">Fast Counterattack</option></select></div>
</header>
<main class="main"><div class="stage">
  <div class="board"><div id="pitch" class="pitch">
    <div class="direction">ATTACK →</div><div class="mid"></div><div class="circle"></div><div class="dot"></div><div class="box l"></div><div class="box r"></div><div class="goal l"></div><div class="goal r"></div>
  </div></div>
  <section class="controls panel">
    <button id="play" class="btn play">▶ PLAY</button><button id="pause" class="btn">Ⅱ PAUSE</button><button id="replay" class="btn">↻ REPLAY</button><button id="newOutcome" class="btn">NEW OUTCOME</button>
    <div class="speed"><span>Speed</span><button data-speed="0.55">SLOW</button><button data-speed="1" class="active">NORMAL</button><button data-speed="1.7">FAST</button></div>
    <div class="timeline"><span id="time">00:00</span><div class="track"><div id="fill" class="fill"></div></div><span>00:10</span></div>
  </section>
  <section class="bottom">
    <div class="info panel"><div class="sectionTitle">TACTICAL RESULT</div><div id="result" class="result">Select a situation, then press PLAY.</div><div id="meta" class="meta"></div><div id="decision" class="decision"><p id="decisionText"></p><div class="opts"><button data-decision="continue">CONTINUE TACTIC</button><button data-decision="press">CHANGE PRESS</button><button data-decision="drop">DROP BACK</button></div></div></div>
    <div id="logPanel" class="logPanel panel"><div class="sectionTitle">LIVE EVENT LOG <button id="collapse" class="collapseBtn">Collapse</button></div><div id="log" class="log"></div></div>
  </section>
</div></main>
</div>
<script>
const OUR={phuoc:{name:'Phuoc',role:'GK',team:'red'},tien:{name:'Tien',role:'CB',team:'red'},vinh:{name:'Vinh',role:'Left',team:'red'},quy:{name:'Quy',role:'Right/Mid',team:'red'},phong:{name:'Phong',role:'Forward',team:'red'}};
const OPP={khoa:{name:'Khoa',role:'GK',team:'blue'},phuc:{name:'Phuc',role:'Left',team:'blue'},ky:{name:'Ky',role:'Right/Pivot',team:'blue'},hung:{name:'Hung',role:'Striker',team:'blue'},nam:{name:'Nam',role:'Pivot',team:'blue'}};
const ALL={...OUR,...OPP};
const situations=[
['Nam has the ball','namBall'],['Nam → Ky','namKy'],['Nam → Hung','namHung'],['Ky receives on our right','kyReceive'],['Ky dribbles forward','kyDribble'],['Ky cuts inside','kyInside'],['Ky → Hung','kyHung'],['Ky + Phuc overload','overload'],['Nam moves left → Ky run','rotate'],['Phong pressing trap','trap'],['Vinh 1v1 vs Phuc','vinh1v1'],['We win the ball','winBall'],['Counterattack','counter'],['Quy shooting space','quyShoot'],['Opponent defense out of position','outShape'],['Opponent counterattack','oppCounter'],['Opponent backward pass','backPass'],['Opponent presses us','ourPressed']
];
const baseOur={phuoc:[5,50],tien:[30,50],vinh:[30,25],quy:[30,75],phong:[42,50]};
const baseOpp={khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[48,50]};
function state(overrides={},ballHolder=null){let s={};for(const id in ALL){s[id]=[...(ALL[id].team==='red'?baseOur[id]:baseOpp[id])];}for(const [id,pos] of Object.entries(overrides))s[id]=[...pos];return {p:s,ball:ballHolder?s[ballHolder].slice():[50,50],holder:ballHolder};}
// Every situation has its own explicit 10-player starting state. Coordinates: x=our goal→opponent goal, y=our left→our right.
const STATES={
namBall:state({phuoc:[5,50],tien:[30,50],vinh:[30,25],quy:[30,75],phong:[42,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[48,50]},'nam'),
namKy:state({phuoc:[5,50],tien:[45,52],vinh:[40,25],quy:[48,72],phong:[42,48],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,52],nam:[48,50]},'nam'),
namHung:state({phuoc:[5,50],tien:[48,50],vinh:[45,25],quy:[45,72],phong:[42,48],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[70,50],nam:[48,50]},'nam'),
kyReceive:state({phuoc:[5,50],tien:[48,55],vinh:[42,25],quy:[50,75],phong:[43,52],khoa:[95,50],phuc:[60,18],ky:[63,82],hung:[72,55],nam:[48,52]},'ky'),
kyDribble:state({phuoc:[5,50],tien:[45,55],vinh:[42,25],quy:[47,75],phong:[43,50],khoa:[95,50],phuc:[60,18],ky:[60,82],hung:[70,55],nam:[48,50]},'ky'),
kyInside:state({phuoc:[5,50],tien:[48,55],vinh:[42,25],quy:[48,76],phong:[43,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,52],nam:[48,50]},'ky'),
kyHung:state({phuoc:[5,50],tien:[50,56],vinh:[43,25],quy:[50,76],phong:[43,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,52],nam:[48,50]},'ky'),
overload:state({phuoc:[5,50],tien:[48,52],vinh:[45,25],quy:[48,75],phong:[42,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[48,50]},'nam'),
rotate:state({phuoc:[5,50],tien:[48,52],vinh:[43,25],quy:[48,75],phong:[43,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[50,50]},'nam'),
trap:state({phuoc:[5,50],tien:[48,52],vinh:[43,25],quy:[48,75],phong:[42,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[48,50]},'nam'),
vinh1v1:state({phuoc:[5,50],tien:[50,52],vinh:[52,25],quy:[50,75],phong:[45,50],khoa:[95,50],phuc:[65,18],ky:[65,82],hung:[72,52],nam:[48,50]},'phuc'),
winBall:state({phuoc:[5,50],tien:[30,50],vinh:[48,25],quy:[42,75],phong:[45,50],khoa:[95,50],phuc:[55,24],ky:[55,78],hung:[70,50],nam:[58,55]},'vinh'),
counter:state({phuoc:[5,50],tien:[30,50],vinh:[48,25],quy:[44,75],phong:[50,50],khoa:[95,50],phuc:[55,22],ky:[58,78],hung:[68,50],nam:[60,55]},'vinh'),
quyShoot:state({phuoc:[5,50],tien:[38,50],vinh:[45,25],quy:[66,72],phong:[55,52],khoa:[95,50],phuc:[70,18],ky:[72,78],hung:[78,52],nam:[62,55]},'quy'),
outShape:state({phuoc:[5,50],tien:[30,50],vinh:[42,25],quy:[42,75],phong:[48,50],khoa:[95,50],phuc:[82,18],ky:[85,82],hung:[88,50],nam:[75,58]},'vinh'),
oppCounter:state({phuoc:[5,50],tien:[48,50],vinh:[45,25],quy:[45,75],phong:[52,50],khoa:[95,50],phuc:[58,18],ky:[62,82],hung:[68,50],nam:[52,55]},'nam'),
backPass:state({phuoc:[5,50],tien:[35,50],vinh:[34,25],quy:[34,75],phong:[48,50],khoa:[95,50],phuc:[62,18],ky:[62,82],hung:[72,50],nam:[55,50]},'nam'),
ourPressed:state({phuoc:[5,50],tien:[30,50],vinh:[32,22],quy:[38,72],phong:[47,50],khoa:[95,50],phuc:[45,20],ky:[47,80],hung:[58,52],nam:[45,52]},'tien')
};
const tacticalNotes={def:'Assignments: Vinh→Phuc, Tien→Hung, Quy→Ky, Phong→Nam. Protect the center and keep the 3-1 shape.',counter:'Fast Counterattack: first forward look, Vinh attacks space, Phong supports centrally, Quy supports wide, Tien stays deeper.'};
let players={},ball={x:50,y:50},initial=null,active='namBall',running=false,paused=false,speed=1,simTime=0,seed=1,timer=null,stepIndex=0,steps=[],resultText='',resultTone='';
const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms/speed));
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmt(t){return `00:${String(Math.min(10,Math.floor(t))).padStart(2,'0')}`}
function log(text){const el=document.createElement('div');el.className='event';el.innerHTML=`<b>${fmt(simTime)}</b> ${text}`;$('log').appendChild(el);$('log').scrollTop=$('log').scrollHeight}
function setResult(text,tone=''){resultText=text;resultTone=tone;$('result').textContent=text;$('result').className='result '+tone}
function render(){for(const [id,p] of Object.entries(players)){let el=document.getElementById('pl-'+id);if(!el){el=document.createElement('div');el.id='pl-'+id;el.className='player '+p.team;el.innerHTML=`<span class="num">${p.role[0]}</span><span class="name">${p.name}</span>`;$('pitch').appendChild(el)}el.style.left=p.x+'%';el.style.top=p.y+'%';el.classList.toggle('hot',!!p.hot)}let b=$('ball');if(!b){b=document.createElement('div');b.id='ball';b.className='ball';$('pitch').appendChild(b)}b.style.left=ball.x+'%';b.style.top=ball.y+'%';b.classList.toggle('hot',!!ball.hot)}
function clearVisuals(){document.querySelectorAll('.arrow').forEach(e=>e.remove())}
function arrow(a,b,type='move',ms=500){const el=document.createElement('div');el.className='arrow '+type;const dx=b[0]-a[0],dy=b[1]-a[1];el.style.left=a[0]+'%';el.style.top=a[1]+'%';el.style.width=Math.hypot(dx,dy)+'%';el.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;$('pitch').appendChild(el);setTimeout(()=>el.remove(),ms/speed+250)}
function reset(){stop();const st=clone(STATES[active]);initial=st;players={};for(const id in ALL){players[id]={...ALL[id],x:st.p[id][0],y:st.p[id][1],startX:st.p[id][0],startY:st.p[id][1],hot:false}}ball={x:st.ball[0],y:st.ball[1],hot:false};simTime=0;stepIndex=0;$('time').textContent='00:00';$('fill').style.width='0%';$('log').innerHTML='';$('status')?.remove();clearVisuals();render();$('result').textContent='Ready — correct starting state loaded.';$('result').className='result';$('meta').textContent=`10 players positioned for “${situations.find(s=>s[1]===active)[0]}”. ${tacticalNotes[$('tactic').value]}`}
function stop(){running=false;paused=false;if(timer)clearTimeout(timer);timer=null;$('play').disabled=false}
async function move(id,x,y,dur=600,type='move',message){if(!running)return;const p=players[id],sx=p.x,sy=p.y,dx=x-sx,dy=y-sy,start=performance.now();p.hot=true;if(message)log(message);arrow([sx,sy],[x,y],type,dur);return new Promise(resolve=>{function frame(now){if(!running){p.hot=false;return resolve()}if(paused){requestAnimationFrame(frame);return}const q=Math.min(1,(now-start)/(dur/speed));p.x=sx+dx*q;p.y=sy+dy*q;render();if(q<1)requestAnimationFrame(frame);else{p.hot=false;resolve()}}requestAnimationFrame(frame)})}
async function travelBall(from,to,dur=550){if(!running)return;const sx=from[0],sy=from[1],dx=to[0]-sx,dy=to[1]-sy,start=performance.now();ball.hot=true;return new Promise(resolve=>{function frame(now){if(!running){ball.hot=false;return resolve()}if(paused){requestAnimationFrame(frame);return}const q=Math.min(1,(now-start)/(dur/speed));ball.x=sx+dx*q;ball.y=sy+dy*q;render();if(q<1)requestAnimationFrame(frame);else{ball.hot=false;resolve()}}requestAnimationFrame(frame)})}
async function pass(from,to,dur=650,success=true){if(!running)return;const a=[players[from].x,players[from].y],target=[players[to].x,players[to].y];players[from].hot=true;log(`${players[from].name} → ${players[to].name}`);arrow(a,target,'pass',dur);await travelBall(a,target,dur);players[from].hot=false;if(success){ball.x=players[to].x;ball.y=players[to].y;initial.holder=to;log(`${players[to].name} receives`)}else log(`Pass intercepted before ${players[to].name} can control`)}
async function dribble(id,path,dur=650){for(const pt of path){if(!running)return;const p=players[id],sx=p.x,sy=p.y,dx=pt[0]-sx,dy=pt[1]-sy,start=performance.now();p.hot=true;log(`${p.name} dribbles into space`);arrow([sx,sy],pt,'move',dur);await new Promise(resolve=>{function frame(now){if(!running){p.hot=false;return resolve()}if(paused){requestAnimationFrame(frame);return}const q=Math.min(1,(now-start)/(dur/speed));p.x=sx+dx*q;p.y=sy+dy*q;ball.x=p.x;ball.y=p.y;ball.hot=true;render();if(q<1)requestAnimationFrame(frame);else{p.hot=false;ball.hot=false;resolve()}}requestAnimationFrame(frame)})}}
async function shoot(id,goalX=96){if(!running)return;const p=players[id];p.hot=true;log(`${p.name} shoots`);arrow([p.x,p.y],[goalX,50],'pass',500);await travelBall([p.x,p.y],[goalX,50],500);p.hot=false;const r=rand();if(r<.34){log('Khoa saves the shot');setResult('🟡 Shot saved by Khoa.','yellow')}else if(r<.62){log('Shot is blocked');setResult('🟡 Shot blocked — rebound possible.','yellow')}else{log('GOAL');setResult(`🟢 Goal — ${p.name} finishes the attack.` ,'green')}}
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
async function wait(ms){let left=ms;while(left>0&&running){if(!paused){const d=Math.min(50,left);await new Promise(r=>setTimeout(r,d/speed));left-=d;simTime=Math.min(10,simTime+d/1000);$('time').textContent=fmt(simTime);$('fill').style.width=(simTime/10*100)+'%'}else await new Promise(r=>setTimeout(r,50))}}
async function reactShape(){const holder=players[Object.keys(players).find(id=>id===initial.holder)];for(const id of Object.keys(players)){if(id===initial.holder)continue;const p=players[id];let tx=p.x,ty=p.y;if(p.team==='red'){if(id==='tien'){ty=50}else if(id==='vinh'){ty=players.phuc.y+7}else if(id==='quy'){ty=players.ky.y-7}else if(id==='phong'){tx=Math.max(35,Math.min(52,ball.x-5));ty=50}}else{if(id==='hung')ty=50;if(id==='phuc')ty=Math.max(10,Math.min(30,p.y));if(id==='ky')ty=Math.min(90,Math.max(70,p.y))}await move(id,tx,ty,300,'move')}}
async function runScenario(){seed=seed||1;setResult('Simulation running…');const k=active;try{
if(k==='namBall'){await move('phong',44,49,650,'press','Phong presses Nam from an angle');await wait(350);log('Nam scans: Ky right, Phuc left, Hung high');await move('ky',63,79,450,'move','Ky adjusts on the right');await move('hung',73,47,400,'move','Hung checks for space');await move('tien',31,49,400,'press','Tien stays goal-side of Hung');await move('vinh',31,26,350,'move','Vinh stays connected to Phuc');await move('quy',31,74,350,'move','Quy stays connected to Ky');const r=rand();if(r<.58)await pass('nam','phuc',650,true);else if(r<.78)await pass('nam','ky',650,true);else if(r<.9)await pass('nam','hung',650,true);else{await dribble('nam',[[53,50],[57,49]],550);log('Nam carries into midfield')}}
else if(k==='namKy'){await move('phong',44,49,450,'press','Phong presses Nam');await wait(220);const success=rand()>.16;await pass('nam','ky',700,success);if(success){await move('quy',55,77,650,'press','Quy reacts to Ky receiving');await move('hung',73,56,420,'move','Hung shifts toward the ball');await move('tien',48,53,420,'press','Tien tracks Hung');await move('ky',70,82,650,'move','Ky drives forward');const r=rand();if(r<.35)await pass('ky','hung',600,true);else if(r<.62)await pass('ky','nam',650,true);else if(r<.82)await pass('ky','phuc',650,true);else await shoot('ky')}}
